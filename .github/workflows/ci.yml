name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: composer lint

  package:
    name: Build plugin zip
    runs-on: ubuntu-latest
    needs: [syntax, phpcs]
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: git archive --format=zip --prefix=sso-login-for-microsoft-entra-id/ -o sso-login-for-microsoft-entra-id.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: sso-login-for-microsoft-entra-id
          path: sso-login-for-microsoft-entra-id.zip
