name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^ \* Version:[[:space:]]*${TAG}$" sso-login-for-microsoft-entra-id.php
          grep -q "^Stable tag: ${TAG}$" readme.txt
          grep -q "'MSENTRA_SSO_VERSION', '${TAG}'" sso-login-for-microsoft-entra-id.php
      - name: Build zip
        run: git archive --format=zip --prefix=sso-login-for-microsoft-entra-id/ -o sso-login-for-microsoft-entra-id.zip HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sso-login-for-microsoft-entra-id.zip --title "$GITHUB_REF_NAME" --generate-notes
